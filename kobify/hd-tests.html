<!doctype html><meta charset="utf-8"><title>AI HD test</title><button id="run">Run actual AI</button><p id="status">Ready</p><canvas id="input" width="64" height="64"></canvas><div id="output"></div><script src="hd-client.js"></script><script>run.onclick=async()=>{const ctx=input.getContext('2d');for(let y=0;y<64;y++)for(let x=0;x<64;x++){ctx.fillStyle=`rgb(${x*4},${y*4},128)`;ctx.fillRect(x,y,1,1);}const start=performance.now();try{const c=await KobifyHD.upscale(input,p=>document.getElementById('status').textContent=p.stage+' '+Math.round(p.value*100)+'%');document.getElementById('output').append(c);document.getElementById('status').textContent='PASS '+c.width+'x'+c.height+' '+Math.round(performance.now()-start)+'ms';}catch(e){document.getElementById('status').textContent='ERROR '+e.message;}};</script>
